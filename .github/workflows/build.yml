name: 构建并发布手机版

on:
  # 只保留定时触发：任何推送都不再重建。
  schedule:
    # 每天 20:00 UTC（北京时间次日 04:00）自动重建一次
    - cron: "0 20 * * *"
  # 需要立刻同步上游时，在 Actions 页面点「Run workflow」手动跑一次。
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游源码：留空 = 用 build.py 里锁定的 SHA；填 main = 跟随上游最新；也可填完整 40 位 SHA"
        required: false
        type: string
      lock_ref:
        description: "构建成功后把本次用的上游 SHA 写回 build.py 的 UPSTREAM_PIN 并提交（之后的定时任务就用新版本）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个，新的构建会取消排队中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 这个任务会下载并执行上游代码。它只负责产出页面，写权限留给下面单独的保活任务，
    # 万一上游被投毒，拿到的也只是一个没有写权限的 token。
    permissions:
      contents: read
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建单文件页面
        env:
          # 定时触发时这个值是空字符串，走 build.py 里锁定的 UPSTREAM_PIN
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          if [ -n "$UPSTREAM_REF" ]; then
            echo "按手动指定的 ref 构建：$UPSTREAM_REF"
            python build.py -o dist/index.html --upstream-ref "$UPSTREAM_REF"
          else
            echo "按 build.py 里锁定的 UPSTREAM_PIN 构建"
            python build.py -o dist/index.html
          fi

      # 注意：这里刻意不用 actions/configure-pages 的 enablement:true 去自动开启 Pages。
      # 仓库自带的 GITHUB_TOKEN 没有创建 Pages 站点的权限，那样会报
      # 「Resource not accessible by integration」直接失败。
      # 请先在 Settings → Pages 把 Source 手动设为「GitHub Actions」。
      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 同时存一份可下载的页面文件
        uses: actions/upload-artifact@v4
        with:
          name: 贝娜的量角器-手机版
          path: dist/index.html
          retention-days: 30
          if-no-files-found: error

  # 手动同步上游后，把这次实际用的 SHA 钉进 build.py，
  # 否则下一次定时任务会拿旧 SHA 重建，把刚同步的内容覆盖回去。
  # 单独一个 job：它需要写权限，而上面的 build 要执行上游代码，不能带写权限。
  lock-ref:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.lock_ref
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 解析本次使用的上游 SHA
        id: resolve
        env:
          REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          if [ -n "$REF" ] && [ "$REF" != "main" ]; then
            if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::upstream_ref 既不是 main 也不是 40 位 SHA：$REF"
              exit 1
            fi
            sha="$REF"
          else
            sha=$(python -c "import json,urllib.request as u; print(json.load(u.urlopen('https://api.github.com/repos/TeamTorappu/BenaProtractor/commits/main'))['sha'])")
          fi
          echo "本次使用的上游 SHA：$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 写回 build.py 的 UPSTREAM_PIN
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, pathlib
          sha = os.environ["SHA"]
          p = pathlib.Path("build.py")
          s = p.read_text(encoding="utf-8")
          new, n = re.subn(
              r'(?m)^(UPSTREAM_PIN\s*=\s*")[0-9a-f]{40}(")',
              lambda m: m.group(1) + sha + m.group(2), s)
          if n != 1:
              raise SystemExit("UPSTREAM_PIN 匹配到 %d 处，期望 1 处" % n)
          p.write_text(new, encoding="utf-8", newline="\n")
          print("UPSTREAM_PIN 已更新为", sha)
          PY

      - name: 提交
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.py
          git commit -m "build: 锁定上游到 $SHA [skip ci]"
          git push

  # 保活：公开仓库只要连续 60 天没有任何代码活动，GitHub 就会自动停用定时触发，
  # 而定时任务自己跑起来并不算「仓库活动」。所以每月补一条提交，把计时器压回去。
  # 用 GITHUB_TOKEN 推送不会再触发工作流（GitHub 有意防递归），[skip ci] 是第二道保险。
  # 单独一个任务，是为了让上面执行上游代码的 build 任务保持只读权限。
  keepalive:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 保活提交（每月一次）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp=$(date -u +%Y-%m)
          if [ "$(cat .keepalive 2>/dev/null)" = "$stamp" ]; then
            echo "本月已有活动记录（$stamp），跳过"
            exit 0
          fi
          printf '%s\n' "$stamp" > .keepalive
          git add .keepalive
          git commit -m "chore: 保活 $stamp [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
