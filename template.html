<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>贝娜的量角器</title>
<style>
/* 主题由 <html data-theme> 决定。head 里的那段脚本会在页面渲染前先算好并写上，
   免得刷新时闪一下浅色。「跟随系统」不是第三种取值，而是在计算时展开成 light / dark。 */
:root{
  color-scheme:light;
  --bg:#f6f6f4; --card:#fff; --fg:#1b1b19; --muted:#71716b; --line:#e3e1da;
  --accent:#185fa5; --chip:#eceff4; --accent-fg:#fff; --code:#f2f2ef;
  --err:#c0366b; --mark:#ffe9a8; --fs:15px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15161a; --card:#1d1f24; --fg:#e9e9e6; --muted:#97978f; --line:#2b2e34;
  --accent:#7fb3e8; --chip:#24272d; --accent-fg:#0d1520; --code:#1a1c21;
  --err:#ef9db4; --mark:#5a4a1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
.app,.detail{position:absolute;inset:0;display:flex;flex-direction:column}
.detail{background:var(--bg);z-index:20}
.bar{
  flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));
}
.srow{display:flex;gap:8px;align-items:center}
#q{
  flex:1;min-width:0;font-size:16px;padding:9px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);outline:none;
  -webkit-appearance:none;appearance:none;
}
#q:focus{border-color:var(--accent)}
.iconbtn{
  flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn.tm{font-size:15px;font-weight:500;color:var(--fg)}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{
  flex:0 0 auto;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font-size:13px;cursor:pointer;white-space:nowrap;
}
.f.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stat{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:8px 14px 4px;font-size:12.5px;color:var(--muted)}
#ver{flex:0 0 auto;font-size:11px;opacity:.85}
.list{flex:1 1 auto;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sect{
  display:flex;align-items:center;gap:8px;padding:10px 14px 6px;
  font-size:12px;color:var(--muted);letter-spacing:.04em;
}
.sect button{
  margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer;
}
.it{
  padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
}
.it:active{background:var(--chip)}
.it b{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.it span{font-size:12px;color:var(--muted);overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.more{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.dtitle{display:flex;gap:8px;align-items:center}
.dtitle .back{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--accent);
  border-radius:10px;padding:6px 11px;font-size:14px;cursor:pointer;
}
.dtitle .back.home{color:var(--muted)}
.dtitle .back[disabled]{color:var(--muted);opacity:.45;cursor:default}
.dtitle .tt{flex:1;min-width:0}
.dtitle .nm{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.dtitle .kd{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);font-size:13.5px;cursor:pointer;white-space:nowrap;
}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab.sp{margin-left:auto}
.tool{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.tool button{
  border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;
  padding:3px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.tool .sp{margin-left:auto}
.tool .lab{font-size:12px;color:var(--muted)}
.pane{
  flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:10px 12px calc(40px + env(safe-area-inset-bottom,0px));
  font-size:var(--fs);
}
.n{border-left:1px solid var(--line);padding-left:9px;margin:1px 0 1px 5px;min-width:0}
.n > summary{
  cursor:pointer;list-style:none;padding:3px 0;
  overflow-wrap:anywhere;word-break:break-word;
  display:flex;gap:6px;align-items:flex-start;
}
.n > summary::-webkit-details-marker{display:none}
.n > summary::before{
  content:"▸";flex:0 0 auto;color:var(--muted);font-size:11px;line-height:1.9;
}
.n[open] > summary::before{content:"▾"}
.leaf{padding:3px 0 3px 15px;overflow-wrap:anywhere;word-break:break-word}
.top{padding:3px 0;overflow-wrap:anywhere;word-break:break-word}
.note{
  font-size:.88em;color:var(--muted);padding-left:15px;
  overflow-wrap:anywhere;word-break:break-word;
}
/* 条件分支单独一行，弱化成旁注的样子，避免和正文抢注意力 */
.cond{
  font-size:.92em;color:var(--muted);padding-left:15px;margin:2px 0;
  border-left:2px solid var(--line);overflow-wrap:anywhere;word-break:break-word;
}
/* 正文里的交叉引用：可点的小标签，跳不过去的就纯文本 */
.ref{
  display:inline;padding:0 4px;border-radius:6px;
  background:var(--chip);border:1px solid var(--line);color:var(--accent);
  font-size:.92em;cursor:pointer;overflow-wrap:anywhere;
}
.rawh{font-weight:500;font-size:13px;color:var(--muted);margin:12px 0 4px}
pre{
  margin:0;padding:10px;border-radius:10px;background:var(--code);border:1px solid var(--line);
  font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre;
}
body.wrap pre{white-space:pre-wrap;overflow-wrap:anywhere}
.props{display:flex;flex-direction:column;gap:0}
.prow{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.prow .k{flex:0 0 4.5em;color:var(--muted);font-size:13px}
.prow .v{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.prow .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.boot{
  position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px;
}
.spin{
  width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--err);padding:24px;font-size:14px;text-align:center;max-width:520px}
</style>
<script>
/* 在页面渲染前先把主题定下来，否则刷新时会先闪一下浅色。
   只算 light / dark，「跟随系统」在这里就展开成具体值。
   字号、换行也一并恢复，免得内容先按默认字号渲染一遍再跳。 */
(function(){
  var root = document.documentElement, dark = false;
  try {
    var m = localStorage.getItem("bena_theme");
    dark = m === "dark" ||
      ((m === "auto" || !m) && window.matchMedia &&
       window.matchMedia("(prefers-color-scheme: dark)").matches);
    var fs = parseInt(localStorage.getItem("bena_font"), 10);
    if (fs >= 13 && fs <= 20) root.style.setProperty("--fs", fs + "px");
    if (localStorage.getItem("bena_wrap") === "1") document.documentElement.className = "wrap";
  } catch (e) {}
  root.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
</head>
<body>

<div class="app">
  <div class="bar">
    <div class="srow">
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="搜索 Buff / 模板 / 藏品 / 棋子 / ID">
      <button class="iconbtn" id="clr" title="清空">×</button>

<div class="boot" id="boot"><div class="spin"></div><div id="bootmsg">正在准备数据…</div></div>

<script>
(function(){
"use strict";
var META = __META__;
var TYPE_LABEL = {
  buff:"常见Buff", buff_template:"Buff模板", global_buff:"全局Buff",
  rogue_item:"肉鸽物品", autochess:"卫戍协议", recal_rune:"全息作战矩阵"
};
var SUBS = META.subs || {};
var LIMIT = 200;
var RECENT_LS = "bena_recent";
var FONT_LS = "bena_font";
var WRAP_LS = "bena_wrap";
var RECENT_MAX = 20;

var boot = document.getElementById("boot");
var bootmsg = document.getElementById("bootmsg");

function die(msg){
  boot.innerHTML = '<div class="err">' + msg + "</div>";
}

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

var IDX = null, DATA = null, LOWER = null, MAP = null;

async function load(){
  bootmsg.textContent = "正在解码数据…";
  await sleep(16);
  var b64 = document.getElementById("payload").textContent.replace(/\s+/g, "");
  var bin = fflate.strToU8(atob(b64), true);
  document.getElementById("payload").textContent = "";

  bootmsg.textContent = "正在解压…（约 " + (META.gzMB || "?") + " MB）";
  await sleep(16);
  var raw = fflate.gunzipSync(bin);
  bin = null;

  bootmsg.textContent = "正在解析…";
  await sleep(16);
  var parsed = JSON.parse(fflate.strFromU8(raw));
  raw = null;

  bootmsg.textContent = "正在建立索引…";
  await sleep(16);
  IDX = parsed.index;
  DATA = parsed.data;
  parsed = null;

  LOWER = new Array(IDX.length);
  MAP = Object.create(null);
  for (var i = 0; i < IDX.length; i++) {
    var e = IDX[i];
    /* 后端给的搜索文本已经 lower 过，这里直接拼 key 的小写形式 */
    LOWER[i] = e[3];
    MAP[META.types[e[0]] + ":" + e[1]] = i;
  }
  return true;
}

/* ---------- 最近浏览 ---------- */
function getRecents(){
  try {
    var raw = localStorage.getItem(RECENT_LS);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveRecents(list){
  try { localStorage.setItem(RECENT_LS, JSON.stringify(list.slice(0, RECENT_MAX))); } catch (e) {}
}

/* 记一次浏览。同一个条目只留最新一条，避免来回点同一项把列表撑满。 */
function addRecent(i){
  var e = IDX[i];
  var t = META.types[e[0]];
  var list = getRecents().filter(function(r){ return !(r.t === t && r.k === e[1]); });
  list.unshift({ t: t, k: e[1], n: e[2] });
  saveRecents(list);
}

function recentIndex(r){
  var i = MAP[r.t + ":" + r.k];
  return i === undefined ? -1 : i;
}

function renderRecents(host){
  var list = getRecents().filter(function(r){ return recentIndex(r) >= 0; });
  if (!list.length) return;
  var head = document.createElement("div");
  head.className = "sect";
  head.appendChild(document.createTextNode("最近浏览"));
  var btn = document.createElement("button");
  btn.textContent = "清空";
  btn.onclick = function(ev){
    ev.stopPropagation();
    saveRecents([]);
    doSearch();
  };
  head.appendChild(btn);
  host.appendChild(head);
  for (var j = 0; j < list.length; j++) {
    host.appendChild(makeItem(recentIndex(list[j]), []));
  }
}

/* ---------- 搜索 ---------- */
var filter = -1, subFilter = 0, results = [], shown = 0, query = "";

function doSearch(){
  var kws = query.toLowerCase().split(/\s+/).filter(function(x){ return x.length > 0; });
  results = [];
  for (var i = 0; i < IDX.length; i++) {
    if (filter >= 0 && IDX[i][0] !== filter) continue;
    if (subFilter && IDX[i][4] !== subFilter) continue;
    var ok = true;
    for (var k = 0; k < kws.length; k++) {
      if (LOWER[i].indexOf(kws[k]) < 0) { ok = false; break; }
    }
    if (ok) results.push(i);
  }
  renderList(true);
}

/* 把命中的关键词标出来。只在列表里做，详情页正文保持干净。 */
function fillHighlighted(host, text, kws){
  if (!kws || !kws.length) { host.textContent = text; return; }
  var low = text.toLowerCase();
  var spans = [];
  for (var i = 0; i < kws.length; i++) {
    var from = 0, at;
    while ((at = low.indexOf(kws[i], from)) >= 0) {
      spans.push([at, at + kws[i].length]);
      from = at + kws[i].length;
    }
  }
  if (!spans.length) { host.textContent = text; return; }
  spans.sort(function(a, b){ return a[0] - b[0]; });
  var merged = [spans[0]];
  for (var s = 1; s < spans.length; s++) {
    var last = merged[merged.length - 1];
    if (spans[s][0] <= last[1]) last[1] = Math.max(last[1], spans[s][1]);
    else merged.push(spans[s]);
  }
  var pos = 0;
  for (var m = 0; m < merged.length; m++) {
    if (merged[m][0] > pos) host.appendChild(document.createTextNode(text.slice(pos, merged[m][0])));
    var mark = document.createElement("mark");
    mark.textContent = text.slice(merged[m][0], merged[m][1]);
    host.appendChild(mark);
    pos = merged[m][1];
  }
  if (pos < text.length) host.appendChild(document.createTextNode(text.slice(pos)));
}

function makeItem(idx, kws){
  var e = IDX[idx];
  var div = document.createElement("div");
  div.className = "it";
  div.dataset.i = idx;
  var b = document.createElement("b");
  fillHighlighted(b, e[2], kws);
  var s = document.createElement("span");
  s.textContent = e[1];
  div.appendChild(b);
  div.appendChild(s);
  return div;
}

function renderList(reset){
  var list = document.getElementById("list");
  if (reset) { list.innerHTML = ""; shown = 0; }
  var kws = query.toLowerCase().split(/\s+/).filter(function(x){ return x.length > 0; });
  var home = reset && !kws.length && filter < 0 && !subFilter;
  var frag = document.createDocumentFragment();
  if (home) renderRecents(frag);
  var end = Math.min(results.length, shown + LIMIT);
  for (var i = shown; i < end; i++) frag.appendChild(makeItem(results[i], kws));
  if (reset && !results.length) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = query ? "没有匹配的条目" : "这里还没有内容";
    frag.appendChild(empty);
  }
  list.appendChild(frag);
  shown = end;

  var stat = document.getElementById("stat");
  if (results.length === 0) stat.textContent = "没有匹配的条目";
  else if (results.length > shown) stat.textContent = "匹配 " + results.length + " 条，已显示前 " + shown + " 条";
  else stat.textContent = "匹配 " + results.length + " 条";
}

document.getElementById("list").addEventListener("click", function(ev){
  var el = ev.target.closest(".it");
  if (el) openEntry(parseInt(el.dataset.i, 10), true);
});

/* ---------- 详情 ---------- */
var current = -1;
var navStack = [];
var readerTab = "t";

function textParts(value){
  /* 正文片段：字符串直接给；数组里 [文本, 行号] 生成可点标签，其余纯文本 */
  var out = [];
  if (typeof value === "string") {
    if (value) out.push(document.createTextNode(value));
    return out;
  }
  if (!Array.isArray(value)) return out;
  for (var i = 0; i < value.length; i++) {
    var part = value[i];
    if (typeof part === "string") {
      if (part) out.push(document.createTextNode(part));
    } else if (Array.isArray(part)) {
      var span = document.createElement("span");
      if (typeof part[1] === "number" && part[1] >= 0) {
        span.className = "ref";
        span.textContent = part[0];
        span.dataset.i = part[1];
        span.onclick = function(ev){
          ev.stopPropagation();
          openEntry(parseInt(this.dataset.i, 10), true);
        };
      } else {
        span.className = "refmiss";
        span.textContent = part[0];
      }
      out.push(span);
    }
  }
  return out;
}

function appendParts(host, value){
  var parts = textParts(value);
  for (var i = 0; i < parts.length; i++) host.appendChild(parts[i]);
}

/* 按上游 document_model.document_rows 的规则渲染：
   - 有 children 或 description 就可折叠
   - description 是缩进一层的旁注
   - 条件分支只有在非 last_one 时才印：有 true 印「若 true …」，否则有 false 印「若 false，则直接跳出」
   老版本把 true 拼进正文、完全丢掉 false，语义会被改写，这里按上游对齐。 */
function renderNode(node, host){
  if (!node || typeof node !== "object" || !("main" in node)) return;
  if (node.main === null || node.main === undefined) return;

  var hasKids = !!(node.children && node.children.length);
  var foldable = hasKids || !!node.description;
  var box;

  if (foldable) {
    var d = document.createElement("details");
    d.className = "n";
    d.open = !node.style_closed;
    var sum = document.createElement("summary");
    appendParts(sum, node.main);
    d.appendChild(sum);
    host.appendChild(d);
    box = d;
  } else {
    var leaf = document.createElement("div");
    leaf.className = "leaf";
    appendParts(leaf, node.main);
    host.appendChild(leaf);
    box = host;
  }

  if (node.description) {
    var nt = document.createElement("div");
    nt.className = "note";
    appendParts(nt, node.description);
    box.appendChild(nt);
  }

  if (!node.last_one) {
    if (node.true) {
      var ct = document.createElement("div");
      ct.className = "cond";
      ct.appendChild(document.createTextNode("若 "));
      appendParts(ct, node.true);
      ct.appendChild(document.createTextNode(" …"));
      box.appendChild(ct);
    } else if (node.false) {
      var cf = document.createElement("div");
      cf.className = "cond";
      cf.appendChild(document.createTextNode("若 "));
      appendParts(cf, node.false);
      cf.appendChild(document.createTextNode("，则直接跳出"));
      box.appendChild(cf);
    }
  }

  if (hasKids) {
    for (var i = 0; i < node.children.length; i++) renderNode(node.children[i], box);
  }
}

function plainParts(value){
  if (typeof value === "string") return value;
  if (!Array.isArray(value)) return "";
  var s = "";
  for (var i = 0; i < value.length; i++) {
    var part = value[i];
    s += typeof part === "string" ? part : (Array.isArray(part) ? part[0] : "");
  }
  return s;
}

/* 复制用：与屏幕上看到的层级与条件行保持一致 */
function flatten(node){
  var out = [];
  (function walk(n, depth){
    if (!n || typeof n !== "object" || !("main" in n)) return;
    if (n.main === null || n.main === undefined) return;
    var pad = new Array(depth + 1).join("    ");
    out.push(pad + plainParts(n.main));
    if (n.description) out.push(pad + "（" + plainParts(n.description) + "）");
    if (!n.last_one) {
      if (n.true) out.push(pad + "若 " + plainParts(n.true) + " …");
      else if (n.false) out.push(pad + "若 " + plainParts(n.false) + "，则直接跳出");
    }
    if (n.children) for (var i = 0; i < n.children.length; i++) walk(n.children[i], depth + 1);
  })(node, 0);
  return out.join("\n");
}

function pretty(s){
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch(err) { return s; }
}

function renderEntry(i){
  current = i;
  var e = IDX[i];
  document.getElementById("dname").textContent = e[2];
  var cat = e[5] || "";
  document.getElementById("dkey").textContent = cat ? (e[1] + " · " + cat) : e[1];

  var paneT = document.getElementById("paneT");
  paneT.innerHTML = "";
  renderNode(DATA[i][0], paneT);

  var paneR = document.getElementById("paneR");
  paneR.innerHTML = "";
  var raws = DATA[i][1] || [];
  for (var r = 0; r < raws.length; r++) {
    if (raws.length > 1) {
      var h = document.createElement("div");
      h.className = "rawh";
      h.textContent = r === 0 ? "item_info" : "item_data";
      paneR.appendChild(h);
    }
    var pre = document.createElement("pre");
    pre.textContent = pretty(raws[r]);
    paneR.appendChild(pre);
  }

  var paneP = document.getElementById("paneP");
  paneP.innerHTML = "";
  var props = document.createElement("div");
  props.className = "props";
  var rows = [
    ["名称", e[2], false],
    ["ID", e[1], true],
    ["类型", TYPE_LABEL[META.types[e[0]]] || META.types[e[0]], false],
    ["分类", cat || "—", false],
    ["子类", subLabel(e[0], e[4]), false],
    ["数据", "随构建内联，可离线打开", false]
  ];
  for (var p = 0; p < rows.length; p++) {
    var row = document.createElement("div");
    row.className = "prow";
    var kk = document.createElement("div");
    kk.className = "k";
    kk.textContent = rows[p][0];
    var vv = document.createElement("div");
    vv.className = "v" + (rows[p][2] ? " mono" : "");
    vv.textContent = rows[p][1];
    row.appendChild(kk);
    row.appendChild(vv);
    props.appendChild(row);
  }
  paneP.appendChild(props);

  showTab(readerTab);
  document.getElementById("detail").hidden = false;
  paneT.scrollTop = 0;
}

function subLabel(typeId, subId){
  var list = SUBS[META.types[typeId]];
  if (!list) return "—";
  for (var i = 0; i < list.length; i++) if (list[i][0] === subId) return list[i][1];
  return "—";
}

function saveScroll(){
  var f = navStack[navStack.length - 1];
  if (f) f.top = document.getElementById("paneT").scrollTop;
}

function openEntry(i, record){
  if (i < 0 || i >= IDX.length) return;
  if (record !== false) saveScroll();
  navStack.push({ i: i, top: 0 });
  renderEntry(i);
  syncNav();
  if (record !== false) {
    addRecent(i);
    setHash(i);
  }
}

function backEntry(){
  if (navStack.length <= 1) return;
  saveScroll();
  navStack.pop();
  var prev = navStack[navStack.length - 1];
  renderEntry(prev.i);
  document.getElementById("paneT").scrollTop = prev.top;
  syncNav();
  setHash(prev.i);
}

function gotoHome(){
  navStack = [];
  document.getElementById("detail").hidden = true;
  syncNav();
  clearHash();
}

function syncNav(){
  document.getElementById("back").disabled = navStack.length <= 1;
}

/* ---------- 深链：地址栏记录当前条目，可分享、可刷新 ---------- */
function setHash(i){
  var e = IDX[i];
  var h = "#" + encodeURIComponent(META.types[e[0]]) + ":" + encodeURIComponent(e[1]);
  if (location.hash === h) return;
  try { history.replaceState(null, "", h); } catch (err) { location.hash = h; }
}

function clearHash(){
  if (!location.hash) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {}
}

function parseHash(){
  var h = location.hash.replace(/^#/, "");
  if (!h) return -1;
  var i = h.indexOf(":");
  if (i < 0) return -1;
  var t, k;
  try {
    t = decodeURIComponent(h.slice(0, i));
    k = decodeURIComponent(h.slice(i + 1));
  } catch (e) { return -1; }
  var idx = MAP[t + ":" + k];
  return idx === undefined ? -1 : idx;
}

/* 兼容上游桌面端的分享链接格式：?target=Buff.sluggish[inf]
   上游用「类名.key」，类名首字母大写，我这里对应的类型名是小写，需要一张对照表。 */
var TARGET_CLASS = {
  Buff: "buff", BuffTemplate: "buff_template", GlobalBuff: "global_buff",
  CardBuff: null,               /* 上游也没有对应条目，忽略 */
  RogueItem: "rogue_item",
  AutochessCharChess: "autochess", AutochessEffect: "autochess", AutochessBand: "autochess",
  Crisis: "recal_rune"
};

function parseTargetParam(){
  var m = /[?&]target=([^&]*)/.exec(location.search || "");
  if (!m) return -1;
  var raw;
  try { raw = decodeURIComponent(m[1]); } catch (e) { return -1; }
  var dot = raw.indexOf(".");
  if (dot < 0) return -1;
  var cls = raw.slice(0, dot), key = raw.slice(dot + 1);
  var t = TARGET_CLASS.hasOwnProperty(cls) ? TARGET_CLASS[cls] : null;
  if (!t) return -1;
  /* 卫戍协议的三类（棋子/技能/策略）在上游是三个不同的类，我这边合并成一个类型，
     所以只要类名能归到 autochess，就直接按类型+key 找。 */
  var idx = MAP[t + ":" + key];
  return idx === undefined ? -1 : idx;
}

/* 启动时的入口：地址栏给的 target 参数优先于 hash */
function startTarget(){
  var i = parseTargetParam();
  return i >= 0 ? i : parseHash();
}

/* ---------- 详情页工具条 ---------- */
function showTab(which){
  readerTab = which;
  document.getElementById("paneT").hidden = which !== "t";
  document.getElementById("paneR").hidden = which !== "r";
  document.getElementById("paneP").hidden = which !== "p";
  document.getElementById("tabT").classList.toggle("on", which === "t");
  document.getElementById("tabR").classList.toggle("on", which === "r");
  document.getElementById("tabP").classList.toggle("on", which === "p");
  document.getElementById("tool").hidden = which === "p";
}

document.getElementById("tabT").addEventListener("click", function(){ showTab("t"); });
document.getElementById("tabR").addEventListener("click", function(){ showTab("r"); });
document.getElementById("tabP").addEventListener("click", function(){ showTab("p"); });
document.getElementById("back").addEventListener("click", backEntry);
document.getElementById("home").addEventListener("click", gotoHome);

document.getElementById("expand").addEventListener("click", function(){
  var all = document.getElementById("paneT").getElementsByTagName("details");
  for (var i = 0; i < all.length; i++) all[i].open = true;
});

document.getElementById("collapse").addEventListener("click", function(){
  var all = document.getElementById("paneT").getElementsByTagName("details");
  for (var i = 0; i < all.length; i++) all[i].open = false;
});

/* 换行：只作用于「原文」，JSON 默认不换行，长行要横向滚 */
function applyWrap(){
  var on = false;
  try { on = localStorage.getItem(WRAP_LS) === "1"; } catch (e) {}
  document.documentElement.classList.toggle("wrap", on);
  document.getElementById("wrap").textContent = on ? "换行开" : "换行";
}

document.getElementById("wrap").addEventListener("click", function(){
  var on = false;
  try { on = localStorage.getItem(WRAP_LS) === "1"; } catch (e) {}
  try { localStorage.setItem(WRAP_LS, on ? "0" : "1"); } catch (e) {}
  applyWrap();
});
applyWrap();

/* 字号：13–20px，跟着 localStorage 走 */
function fontSize(){
  var v = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"), 10);
  return v >= 13 && v <= 20 ? v : 15;
}

function setFontSize(v){
  v = Math.max(13, Math.min(20, v));
  document.documentElement.style.setProperty("--fs", v + "px");
  try { localStorage.setItem(FONT_LS, String(v)); } catch (e) {}
}

document.getElementById("fsdown").addEventListener("click", function(){ setFontSize(fontSize() - 1); });
document.getElementById("fsup").addEventListener("click", function(){ setFontSize(fontSize() + 1); });

document.getElementById("copy").addEventListener("click", function(){
  if (current < 0) return;
  var btn = this;
  var text;
  if (readerTab === "r") text = (DATA[current][1] || []).map(pretty).join(",\n");
  else if (readerTab === "p") text = IDX[current][2] + "\n" + IDX[current][1];
  else text = flatten(DATA[current][0]);
  copyText(text, btn);
});

function copyText(text, btn){
  var old = btn.textContent;
  var done = function(){
    btn.textContent = "已复制";
    setTimeout(function(){ btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
  } else {
    fallback(text, done);
  }
}

function fallback(text, done){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch(e) { alert("复制失败，请长按选择文本"); }
  document.body.removeChild(ta);
}

/* ---------- 顶部交互 ---------- */
var q = document.getElementById("q");
var timer = null;
q.addEventListener("input", function(){
  clearTimeout(timer);
  timer = setTimeout(function(){ query = q.value.trim(); doSearch(); }, 120);
});
document.getElementById("clr").addEventListener("click", function(){
  q.value = ""; query = ""; doSearch(); q.focus();
});

/* ---------- 主题 ---------- */
var THEME_LS = "bena_theme";
var THEMES = [
  { id: "auto",  mark: "自", tip: "跟随系统" },
  { id: "light", mark: "浅", tip: "浅色" },
  { id: "dark",  mark: "深", tip: "深色" }
];
var themeBtn = document.getElementById("theme");

function themeMode(){
  try {
    var m = localStorage.getItem(THEME_LS);
    if (m === "light" || m === "dark" || m === "auto") return m;
  } catch (e) {}
  return "auto";
}

function applyTheme(){
  var cur = themeMode(), t = THEMES[0];
  for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === cur) t = THEMES[i];
  var dark = t.id === "dark" ||
    (t.id === "auto" && window.matchMedia &&
     window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  themeBtn.textContent = t.mark;
  themeBtn.title = "主题：" + t.tip + "（点击切换）";
}

themeBtn.addEventListener("click", function(){
  var cur = themeMode(), i = 0;
  for (var k = 0; k < THEMES.length; k++) if (THEMES[k].id === cur) i = k;
  var next = THEMES[(i + 1) % THEMES.length].id;
  try { localStorage.setItem(THEME_LS, next); } catch (e) {}
  applyTheme();
});

if (window.matchMedia) {
  var mqDark = window.matchMedia("(prefers-color-scheme: dark)");
  var onSysTheme = function(){ if (themeMode() === "auto") applyTheme(); };
  if (mqDark.addEventListener) mqDark.addEventListener("change", onSysTheme);
  else if (mqDark.addListener) mqDark.addListener(onSysTheme);
}
applyTheme();

/* ---------- 筛选条 ---------- */
function countType(t){
  var n = 0;
  for (var i = 0; i < IDX.length; i++) if (IDX[i][0] === t) n++;
  return n;
}

function countSub(t, s){
  var n = 0;
  for (var i = 0; i < IDX.length; i++) if (IDX[i][0] === t && IDX[i][4] === s) n++;
  return n;
}

function buildSubFilters(){
  var box = document.getElementById("subfilters");
  box.innerHTML = "";
  if (filter < 0) { box.hidden = true; return; }
  var list = SUBS[META.types[filter]];
  if (!list || !list.length) { box.hidden = true; return; }
  box.hidden = false;

  var all = document.createElement("button");
  all.className = "f on";
  all.textContent = "全部 " + countType(filter);
  all.onclick = function(){ setSubFilter(0, all); };
  box.appendChild(all);

  for (var j = 0; j < list.length; j++) {
    (function(sid, label){
      var b = document.createElement("button");
      b.className = "f";
      b.textContent = label + " " + countSub(filter, sid);
      b.onclick = function(){ setSubFilter(sid, b); };
      box.appendChild(b);
    })(list[j][0], list[j][1]);
  }
}

function setSubFilter(s, btn){
  subFilter = s;
  var kids = document.getElementById("subfilters").children;
  for (var i = 0; i < kids.length; i++) kids[i].classList.remove("on");
  btn.classList.add("on");
  document.getElementById("list").scrollTop = 0;
  doSearch();
}

function buildFilters(){
  var box = document.getElementById("filters");
  var all = document.createElement("button");
  all.className = "f on";
  all.textContent = "全部 " + IDX.length;
  all.onclick = function(){ setFilter(-1, all); };
  box.appendChild(all);
  for (var t = 0; t < META.types.length; t++) {
    (function(t){
      var nm = META.types[t];
      var b = document.createElement("button");
      b.className = "f";
      b.textContent = (TYPE_LABEL[nm] || nm) + " " + countType(t);
      b.onclick = function(){ setFilter(t, b); };
      box.appendChild(b);
    })(t);
  }
}

function setFilter(t, btn){
  filter = t;
  var kids = document.getElementById("filters").children;
  for (var i = 0; i < kids.length; i++) kids[i].classList.remove("on");
  btn.classList.add("on");
  subFilter = 0;
  buildSubFilters();
  document.getElementById("list").scrollTop = 0;
  doSearch();
}

/* 滚动到底自动续加载 */
document.getElementById("list").addEventListener("scroll", function(){
  var el = this;
  if (shown < results.length && el.scrollTop + el.clientHeight > el.scrollHeight - 240) {
    renderList(false);
  }
});

/* ---------- 启动 ---------- */
(async function(){
  try {
    if (typeof fflate === "undefined") { die("解压库未能加载"); return; }
    await load();
    if (!IDX || !IDX.length) { die("数据为空"); return; }
    buildFilters();
    query = q.value.trim();
    doSearch();
    document.getElementById("ver").textContent =
      "数据 " + String(META.builtAt || "").slice(0, 10) + " · " + IDX.length + " 条" +
      (META.upstream && META.upstream.sha ? " · " + META.upstream.sha : "");
    boot.parentNode.removeChild(boot);

    var start = startTarget();
    if (start >= 0) openEntry(start, true);
  } catch (e) {
    die("数据加载失败：" + (e && e.message ? e.message : e) +
        "<br><br>请确认页面完整、未被截断，且浏览器允许执行内联脚本（微信内置浏览器可能限制，建议用系统浏览器打开）。");
  }
})();
})();
